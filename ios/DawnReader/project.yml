name: DawnReader

options:
  bundleIdPrefix: com.keeplearning
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"

packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.9.0

targets:
  DawnReader:
    type: application
    platform: iOS
    sources:
      - path: DawnReader
    info:
      path: DawnReader/Info.plist
      properties:
        CFBundleDisplayName: Dawn Reader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - org.idpf.epub-container
        CFBundleURLTypes:
          - CFBundleURLName: com.keeplearning.dawnreader.sync
            CFBundleURLSchemes:
              - dawnreader
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keeplearning.dawnreader
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: 6.0
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8QTVA46J32
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - DawnReaderTests

  DawnReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DawnReaderTests
    dependencies:
      - target: DawnReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keeplearning.dawnreader.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
